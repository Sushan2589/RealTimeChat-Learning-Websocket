
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ChatApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-gray-900 p-8 rounded-2xl border border-gray-800">
    <h1 class="text-3xl font-bold mb-2">Welcome back</h1>
    <p class="text-gray-400 mb-8">Login to continue chatting.</p>

    <form id="loginForm" class="space-y-4">
      <input id="username" type="text" placeholder="Username"
        class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        required>

      <input id="password" type="password" placeholder="Password"
        class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        required>

      <button class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-semibold">
        Login
      </button>
    </form>

    <p id="message" class="mt-4 text-sm"></p>

    <p class="text-gray-400 mt-6 text-center">
      Don't have an account?
      <a href="/register.html" class="text-blue-400">Register</a>
    </p>
  </div>

<script>
  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (!response.ok) {
        message.textContent = data.error;
        message.className = "mt-4 text-sm text-red-400";
        return;
      }

      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = "/index.html";

    } catch (error) {
      message.textContent = "Could not connect to server.";
    }
  });
</script>

</body>
</html>
