<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4"
  >
    <div>
      <h1 class="text-2xl font-bold mb-4">Create Account</h1>
      <p class="text-gray-400">Join the conversation</p>

      <form id="registrationForm">
        <input
          type="text"
          id="username"
          placeholder="Username"
          class="w-full px-4 py-2 mt-4 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />
        <input
          type="password"
          id="password"
          placeholder="Password"
          class="w-full px-4 py-2 mt-4 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />
        <button
          type="submit"
          class="w-full mt-4 bg-blue-500 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition"
        >
          Register
        </button>
      </form>

      <p id="message" class="mt-4 text-sm"></p>

      <p class="text-gray-400 mt-6 text-center">
        Already have an account?
        <a href="/login.html" class="text-blue-400">Login</a>
      </p>
    </div>

    <script>
      const form = document.getElementById("registrationForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {
          const response = await fetch("/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json();

          if (response.ok) {
            message.textContent =
              "Registration successful! Redirecting to login...";
            message.className = "mt-4 text-sm text-green-500";
            setTimeout(() => {
              window.location.href = "/login.html";
            }, 2000);
          }
        } catch (error) {
          message.textContent = "Could not connect to server.";
        }
      });
    </script>
  </body>
</html>
