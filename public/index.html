<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Time Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <h1 class="text-3xl font-bold underline text-center my-4">
      Real Time Chat App
    </h1>

    <div class="flex justify-between items-center mb-4">
      <p>Welcome, <span id="username"></span></p>
      <button id="logout" class="text-red-500">Logout</button>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm mb-4">
      <h2 class="font-bold mb-2">Find users</h2>

      <input
        id="search"
        placeholder="Search username..."
        class="w-full p-3 bg-gray-100 rounded-lg outline-none focus:ring-2 focus:ring-blue-300"
      />

      <div id="results" class="mt-3 space-y-2"></div>
    </div>

    <div
      class="max-w-5xl mx-auto bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden"
    >
      <div
        id="chat"
        class="h-[500px] overflow-y-auto p-6 space-y-4 bg-gray-50"
      ></div>
      <div
        class="p-4 border-t border-gray-200 bg-white flex items-center gap-3 w-full"
      >
        <input
          id="msg"
          placeholder="Enter your message..."
          class="flex-1 min-w-0 px-5 py-4 bg-gray-100 border border-transparent rounded-xl outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
        />

        <button
          onclick="sendMessage()"
          class="shrink-0 bg-blue-500 hover:bg-blue-700 text-white font-medium px-5 py-4 rounded-xl transition"
        >
          Send
        </button>
      </div>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) {
        window.location.href = "/login.html";
      }

      const myId = user.id;
      const myName = user.username;

      document.getElementById("username").textContent = myName;

      // Logout
      document.getElementById("logout").addEventListener("click", () => {
        localStorage.removeItem("user");
        window.location.href = "/login.html";
      });

      const ws = new WebSocket("ws://localhost:8080");
      const msgInput = document.getElementById("msg");
      const sendButton = document.querySelector("button");

      ws.onmessage = (event) => {
        const chatDiv = document.getElementById("chat");
        const message = document.createElement("div");
        const data = JSON.parse(event.data);

        const isMine = data.senderId === myId;

        const messageWrapper = document.createElement("div");

        messageWrapper.className = `flex flex-col ${
          isMine ? "items-end" : "items-start"
        }`;

        const sender = document.createElement("span");
        sender.textContent = data.sender;
        sender.className = "text-xs text-gray-500 mb-1 px-2";

        message.textContent = data.message;

        message.className = `
        max-w-[75%] px-4 py-3 rounded-2xl text-sm shadow-sm
        ${
          isMine
            ? "bg-blue-500 text-white rounded-br-sm"
            : "bg-white text-gray-800 border border-gray-200 rounded-bl-sm"
        }
    `;
        messageWrapper.appendChild(sender);
        messageWrapper.appendChild(message);

        chatDiv.appendChild(messageWrapper);
      };

      ws.onclose = () => {
        const chatDiv = document.getElementById("chat");
        const msg = document.createElement("p");
        msg.innerHTML = "Connection closed";
        msg.style.color = "red";
        msg.style.fontWeight = "bold";
        chatDiv.appendChild(msg);
      };

      function sendMessage() {
        if (msgInput.value.trim()) {
          const data = {
            sender: myName,
            senderId: myId,
            message: msgInput.value.trim(),
          };

          ws.send(JSON.stringify(data));
          msgInput.value = "";
        }
      }

      // Allow sending with Enter key
      msgInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      const searchInput = document.getElementById("search");
      const resultsDiv = document.getElementById("results");

      searchInput.addEventListener("input", async () => {
        const search = searchInput.value.trim();

        if (!search) {
          results.innerHTML = "";
          return;
        }

        try {
          const response = await fetch(
            `/users?username=${encodeURIComponent(search)}`,
          );

          const users = await response.json();

          results.innerHTML = "";

          const filteredUsers = users.filter((item) => item.id !== myId);

          if (filteredUsers.length === 0) {
            results.textContent = "No users found.";
            return;
          }

          filteredUsers.forEach((item) => {
            const div = document.createElement("div");
            div.className = "p-3 bg-gray-100 rounded-lg";
            div.textContent = item.username;

            div.addEventListener("click", () => {
              openChat(item);
            });

            results.appendChild(div);
          });
        } catch (error) {
          results.textContent = "Could not search users.";
        }
      });

      function openChat(user) {
        console.log("Open chat with", user);

          results.innerHTML = "";

        document.getElementById("chat").innerHTML = `
    <h2 class="text-xl font-bold mb-4">
      Chatting with ${user.username}
    </h2>
  `;
      }
    </script>
  </body>
</html>
